<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Essentials · Student Market</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="indexheader.css">
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo-btn">
            <img src="assets/brand-mark.svg" alt="Retriever Rush Logo" width="32" height="32">
            Retriever Rush
        </a>
        <nav class="top-nav">
            <a href="index.html">Browse food</a>
            <a href="supplies.html" class="active">Student Market</a>
            <a href="checkout.html">
                <img src="assets/bag.svg" alt="Bag Icon" width="20" height="20">
            </a>
        </nav>
    </header>

    <main class="container section">
        <span class="eyebrow">STUDENT MARKET / LAB ESSENTIALS</span>
        <h1 style="margin: 12px 0 20px;">Lab gear and safety supplies.</h1>
        <p>Protective safety goggles, coats, and equipment for campus laboratory sessions.</p>

        <!--ofc the search barrrr -->
        <div class="form-card" style="margin: 24px 0 32px; display: flex; gap: 12px; align-items: center;">
            <img src="assets/search.svg" alt="Search Icon" width="20" height="20">
            <input placeholder="Search lab supplies..." style="flex: 1; border: none; outline: none;">
            <button class="btn">Search</button>
        </div>

        <!-- the menu if they want to see it again -->
        <div class="button-row" style="margin-bottom: 32px;">
            <a href="supplies.html" class="btn btn-secondary">All</a>
            <a href="calculators.html" class="btn btn-secondary">Calculators</a>
            <a href="study-tools.html" class="btn btn-secondary">Study tools</a>
            <a href="lab-supplies.html" class="btn">Lab essentials</a>
        </div>

        <!-- the single item they want and or need -->
        <div class="catalog-grid">
            <div class="catalog-card">
                <div class="card-art">
                    <img src="assets/goggles.svg" alt="Lab Goggles" width="400" height="320">
                </div>
                <div class="card-content">
                    <h2>Lab Goggles</h2>
                    <p>Protective goggles for your lab class.</p>
                    <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600; color: #73716C;">Unavailable</span>
                        <button class="btn" disabled>Unavailable</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
