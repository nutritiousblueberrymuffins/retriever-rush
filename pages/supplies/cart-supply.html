<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Cart · Retriever Rush</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="indexheader.css">
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo-btn">
            <img src="assets/brand-mark.svg" alt="Retriever Rush Logo" width="32" height="32">
            Retriever Rush
        </a>
        <nav class="top-nav">
            <a href="index.html">Browse food</a>
            <a href="supplies.html" class="active">Student Market</a>
            <a href="cart-supply.html" class="cart-link">
                <img src="assets/bag.svg" alt="Bag Icon" width="20" height="20">
                <span class="cart-count-badge">0</span>
            </a>
        </nav>
    </header>

    <main class="container section">
        <span class="eyebrow">
            <img src="assets/back.svg" alt="Back Arrow" width="14" height="14"> 
            STUDENT MARKET / YOUR CART
        </span>
        <h1>Your Supply Cart</h1>
        <p class="subtitle">Review selected items before proceeding to checkout.</p>

        <div class="cart-layout">
            
            <!--a list of cart items -->
            <!-- This one is when you are borrowing an item too. -->
            <!-- another item they are checking out, a study kit -->
            <div id="cart-items-container" class="cart-items-list"></div>

            <!--summary of the sidebar with prices-->
            <div class="form-card" id="cart-summary-sidebar"></div>

        </div>
    </main>

    <script src="supply-cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateCartBadge();
            renderCartPage();
        });
    </script>
</body>
</html>
</body>
</html>
