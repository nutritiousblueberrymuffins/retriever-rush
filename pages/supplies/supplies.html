<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Market - Retriever Rush</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a class="logo" href="../index.html">Retriever Rush</a>
        <nav>
          <header>
              <nav>
                  <ul class="list-of-navigations">
                      <li><a href="index.html">Retriever Rush</a></li>
                      <li><a href="menu.html">Browse Food</a></li>
                      <li><a href="supplies.html" class="active">Student Market</a></li>
                      <li><a href="login.html">Login</a></li>
                      <li><a href="signup.html">Sign Up</a></li>
                      <li><a href="cart-supply.html">Cart (<span class="cart-count-badge">0</span>)</a></li>
                  </ul>
              </nav>
          </header>
        </nav>
    </header>

    <div class="title-bar">
        <h1>Student Market: Borrow & Buy</h1>
    </div>

    <main>
        <form>
            <label for="search">Search supplies</label>
            <input id="search" type="text" placeholder="Search supplies...">
        </form>

        <h2>Available Equipment</h2>

        <div class="item">
            <a href="item-calculator.html">Scientific Calculator</a>
            <span class="open">In Stock</span>
            <div class="actions">
                <button type="button" onclick="addToCart('calculator', 'Scientific Calculator', 0.00, 'borrow', 'assets/calculator.svg')" class="btn">Borrow Free</button>
                <button type="button" onclick="addToCart('calculator', 'Scientific Calculator', 18.99, 'buy', 'assets/calculator.svg')" class="btn">Buy $18.99</button>
            </div>
        </div>

        <div class="item">
            <a href="item-study-kit.html">Study Kit</a>
            <span class="open">In Stock</span>
            <div class="actions">
                <button type="button" onclick="addToCart('study-kit', 'Study Kit Bundle', 0.00, 'borrow', 'assets/study-kit.svg')" class="btn">Borrow Free</button>
                <button type="button" onclick="addToCart('study-kit', 'Study Kit Bundle', 4.99, 'buy', 'assets/study-kit.svg')" class="btn">Buy $4.99</button>
            </div>
        </div>

        <div class="item">
            <a href="item-lab-googles.html">Lab Safety Goggles</a>
            <span class="open">In Stock</span>
            <div class="actions">
                <button type="button" onclick="addToCart('goggles', 'Lab Safety Goggles', 0.00, 'borrow', 'assets/goggles.svg')" class="btn">Borrow Free</button>
                <button type="button" onclick="addToCart('goggles', 'Lab Safety Goggles', 8.50, 'buy', 'assets/goggles.svg')" class="btn">Buy $8.50</button>
            </div>
        </div>
    </main>

    <footer>
        <p>Retriever Rush - UMBC IS 448, Group 8</p>
    </footer>

    <script src="supply-cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', updateCartBadge);
    </script>
</body>
</html>
</html>
