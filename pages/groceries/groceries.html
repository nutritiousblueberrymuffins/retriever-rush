<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Groceries Page</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>UMBC Online Grocery Store</h1>
        <a href="login.html">Logout</a>

        <h2>Groceries</h2>
        
        <form action="delivery.html" method="get">
            <h3>Produce</h3>

            <input type="checkbox" id="pineapple" name="item" value="Pineapples">
            <label for="pineapple">Pineapple - $8.00</label>
            <label for="pineapple_quantity">Quantity: </label>
            <input type="number" id="pineapple_quantity" name="pineapple_quantity" min="0" value="0"> <br/>

            <input type="checkbox" id="strawberries" name="item" value="Strawberries">
            <label for="strawberries">Strawberries - $6.70</label>
            <label for="strawberry_quantity">Quantity: </label>
            <input type="number" id="strawberry_quantity" name="strawberry_quantity" min="0" value="0"> <br/>    
            
            <input type="checkbox" id="grapes" name="item" value="Grapes">
            <label for="grapes">Grapes - $5.90</label>
            <label for="grapes_quantity">Quantity: </label>
            <input type="number" id="grapes_quantity" name="grapes_quantity" min="0" value="0"><br/><br/>

            <h3>Dairy</h3>

            <input type="checkbox" id="milk" name="item" value="Milk">
            <label for="milk">Milk - $4.99</label>
            <label for="milk_quantity">Quantity: </label>
            <input for="number" id="milk_quantity" name="milk_quantity" min="0" value="0"><br/>

            <input type="checkbox" id="eggs" name="item" value="Eggs">
            <label for="eggs">Dozen of Eggs - $5.99</label>
            <label for="eggs_quantity">Quantity: </label>
            <input for="number" id="eggs_quantity" name="eggs_quantity" min="0" value="0"><br/>

            <input type="checkbox" id="cheese" name="item" value="Cheese">
            <label for="cheese">Cheese - $3.89</label>
            <label for="cheese_quantity">Quantity: </label>
            <input for="number" id="cheese_quantity" name="cheese_quantity" min="0" value="0"><br/>

            <br/>
            <h3>Snacks</h3>

            <input type="checkbox" id="doritos" name="item" value="Doritos">
            <label for="doritos">Doritos cool ranch - 3.39</label>
            <label for="doritos_quantity">Quantity: </label>
            <input for="number" id="doritos_quantity" name="doritos_quantity" min="0" value="0"><br/>

            <input type="checkbox" id="pocky" name="item" value="Pocky">
            <label for="Pocky">Pocky - $4.39</label>
            <label for="pocky_quantity">Quantity: </label>
            <input for="number" id="pocky_quantity" name="pocky_quantity" min="0" value="0"><br/>

            <input type="checkbox" id="pringles" name="item" value="Pringles">
            <label for="pringles">Pringles original - $4.39</label>
            <label for="pringles_quantity">Quantity: </label>
            <input for="number" id="pringles_quantity" name="pringles_quantity" min="0" value="0"><br/>

            <br/>
            <input type="submit" value="Proceed to Checkout">
            <p><a href="login.html">Back to Login</a></p>
            

     


        </form>
    </body>
</html>
