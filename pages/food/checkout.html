<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Retriever Rush</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <header>
    <a class="logo" href="../../index.html">Retriever Rush</a>
    <nav>
      <a href="menu.html">Cart</a>
      <a href="../login.html">Log in</a>
    </nav>
  </header>

  <div class="title-bar">
    <h1>Check Out</h1>
  </div>

  <main>
    <form action="tracking.html">
      <h2>Deliver to</h2>
      <label for="building">Select building</label>
      <select id="building">
        <option>Select building</option>
        <option>Engineering and Computer Science (ECS)</option>
        <option>Albin O. Kuhn Library</option>
        <option>The Commons</option>
      </select>

      <h2>Class schedule</h2>
      <label for="link-schedule">
        <input type="checkbox" id="link-schedule" checked>
        Link class schedule
      </label>
      <p>Next class: IS448</p>
      <button class="button button-dark" type="submit">Place order</button>
    </form>
  </main>
  <footer>
    <p>Retriever Rush - UMBC IS 448, Group 8</p>
  </footer>

</body>
</html>
