<!-- The HTML Elements -->
<div class="square"></div>
<div class="circle"></div>
<div class="triangle"></div>

<style>
  /* Square: Equal width and height */
  .square {
    width: 100px;
    height: 100px;
    background-color: #3498db;
    margin-bottom: 20px;
  }

  /* Circle: A square with 50% border-radius */
  .circle {
    width: 100px;
    height: 100px;
    background-color: #e74c3c;
    border-radius: 50%;
    margin-bottom: 20px;
  }

  /* Triangle: Created using clever border tricks */
  .triangle {
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 100px solid #2ecc71;
  }
</style>
